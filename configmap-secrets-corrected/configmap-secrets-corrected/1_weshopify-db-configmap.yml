apiVersion: v1
kind: ConfigMap
metadata:
  name: weshopify-db-config
  labels:
    app.kubernetes.io/name: weshopify
    app.kubernetes.io/component: database-config
data:
  DB_DRIVER_NAME_VALUE: "com.mysql.cj.jdbc.Driver"
  DB_HOST_SERVICE_NAME_VALUE: "weshopify-db"
  DB_SCHEMA_VALUE: "weshopify-app"
  DB_PORT_VALUE: "3306"
  DB_USERNAME_VALUE: "weshopify"

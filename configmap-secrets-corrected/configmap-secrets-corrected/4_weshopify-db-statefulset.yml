apiVersion: v1
kind: Service
metadata:
  name: weshopify-db
  labels:
    app.kubernetes.io/name: weshopify
    app.kubernetes.io/component: database
spec:
  # A headless Service gives the StatefulSet a stable DNS name.
  clusterIP: None
  selector:
    app.kubernetes.io/name: weshopify
    app.kubernetes.io/component: database
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weshopify-db
  labels:
    app.kubernetes.io/name: weshopify
    app.kubernetes.io/component: database
spec:
  serviceName: weshopify-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weshopify
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weshopify
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:8.4.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weshopify-db-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: weshopify-db-config
                  key: DB_SCHEMA_VALUE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: weshopify-db-config
                  key: DB_USERNAME_VALUE
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weshopify-db-secret
                  key: mysql-app-password
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
        labels:
          app.kubernetes.io/name: weshopify
          app.kubernetes.io/component: database-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: weshopify-gp3
        resources:
          requests:
            storage: 4Gi
